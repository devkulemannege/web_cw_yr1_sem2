<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="author" content="Devpriya Kulemannege">
    <link rel="stylesheet" href="css/signin.css">
    <link rel="stylesheet" href="css/global.css">
    <title>Zeroth LMS | Sign In</title>
</head>
<body>
    <header style="background-color: #E1D9BC; display: flex;justify-content: center;">
        <div class="header_btn_div" style="box-shadow: none; margin-left: -5px;">
            <button id="header_btn" onclick="window.location.href='home.html'" style="font-size: 1.6rem;">Zeroth University LMS</button>
        </div>
        <!--<h2 class="fix_font_fam" style="margin-left: 610px; color: black; font-size: 2rem;"">Zeroth University LMS</h2>-->
    </header>

    <div class="center">
        <form class="signin_form" method="POST">
            <h2 class="fix_font_fam" style="color: black; margin-top: 5px;">Sign In</h2>
            <input class="input_box" type="text" name="username" placeholder="Username"><br>
            <input class="input_box" type="password" name="password" placeholder="Password"><br>
            <button class="btn" type="submit">Sign In</button>
        </form>
    </div>

    <footer>
        <div class="footer_div" style="margin-top: auto;">
            <p class="footer_rights" style="margin-left: 270px;">&copy; 2024 Zeroth University. All rights reserved.</p>
            <a class="footer_links" style="margin-left: 10px;" href="mailto:zerothuniversity@ac.uk">Contact Us</a>
        </div>
    </footer>
</body>
</html>
