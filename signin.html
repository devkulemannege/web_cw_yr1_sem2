<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/signin.css">
    <link rel="stylesheet" href="css/global.css">
    <title>Zeroth LMS | Sign In</title>
</head>
<body>
    <!-- header section -->
    <header>
        <div class="logo_btn">
            <a href="" style="margin-left: 20px;">
                <img src="assets/2lmsLogo.png" alt="Zeroth University LMS Logo" height="50" width="250" title="Go to homepage">
            </a>
        </div>
    </header>

    <!-- main section -->
    <div class="center">
        <form class="signin_form" method="POST">
            <h2 class="form_head">Sign In</h2>
            <p id="invalid" class="error-text">Invalid Credentials</p>
            <p id="unfilled" class="error-text">Please fill All Fields</p>
            <input class="input_box" id="emailBox" type="text" name="E-mail" placeholder="E-mail" aria-label="email input"><br>
            <input class="input_box" id="pswBox" type="password" name="password" placeholder="Password" aria-label="password input"><br>
            <a 
                href="mailto:zerothuniversity@ac.uk" 
                style="font-family: Arial, Helvetica, sans-serif;
                padding-top: 1vh;
                margin-bottom: -1.4vh;
                font-size: small;
                text-decoration: none;">
                Facing an issue? Contact us.
            </a>
            <button class="btn" type="submit" onclick="return validateSignin(event)">Sign In</button>
        </form>
        <div class="demo_info">
            <p>Demo Account<br>Email: elias.8645@zeroth.edu.us<br>Password: elias8645</p>
        </div>
    </div>
    <!-- footer section -->
    <footer>
        <p id="footer_text">2024 Zeroth University. All rights reserved.</p>
    </footer>
    <script src="js/signin.js"></script>
</body>
</html>
